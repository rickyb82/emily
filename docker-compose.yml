services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - FAMILAI_IN_DOCKER=1
      - DATA_DIR=/data
      - DATABASE_URL=sqlite+aiosqlite:////data/familai.db
      - SANDBOX_URL=http://sandbox:8080
      - WORDCRAFT_HOST=${WORDCRAFT_HOST:-}
      - WORDCRAFT_WEB=${WORDCRAFT_WEB:-}
    volumes:
      - ./data:/data
      - ./mcp_servers.json:/app/mcp_servers.json:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default
      - sandbox_net
    depends_on:
      - sandbox

  # Esecuzione codice generato dall'AI: isolata, senza internet, risorse limitate
    extra_hosts:
      - "host.docker.internal:host-gateway"   # per raggiungere Ollama nativo sull'host (Mac/Linux)

  sandbox:
    build: ./sandbox
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /work:size=512m,uid=10001,gid=10001
    networks:
      - sandbox_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    environment:
      - SANDBOX_MAX_TIMEOUT=120
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  # Ricerca web in casa: SearXNG (Google/Bing/DDG/Wikipedia via API JSON, nessuna chiave). Raggiungibile solo dal backend.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=${SECRET_KEY:-cambiami}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_cache:/var/cache/searxng
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "1" }

  # Modello locale (opzionale, per la Ubuntu/Linux): attiva con COMPOSE_PROFILES=ollama nel .env e OLLAMA_URL=http://ollama:11434.
  # Sul Mac NON usarlo: Docker non vede la GPU; installa Ollama nativo e usa OLLAMA_URL=http://host.docker.internal:11434.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    # GPU NVIDIA (se presente, con nvidia-container-toolkit): togli il commento
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # WordCraft (opzionale): word processor open source con server MCP. Il modello crea/modifica documenti Word, ODT,
  # PDF... Attiva con COMPOSE_PROFILES=wordcraft e WORDCRAFT_HOST=wordcraft:7982 nel .env (./familai.sh wordcraft up).
  wordcraft:
    build:
      context: extras/wordcraft
    image: familai-wordcraft
    profiles: ["wordcraft"]
    restart: unless-stopped
    volumes:
      - ./data:/data
    expose:
      - "7982"
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "1" }

  # WordCraft nel browser (editor completo su /wordcraft/, stesso profilo)
  wordcraft-web:
    build:
      context: extras/wordcraft
      dockerfile: Dockerfile.web
    image: familai-wordcraft-web
    profiles: ["wordcraft"]
    restart: unless-stopped
    expose:
      - "80"

networks:
  default:
  sandbox_net:
    internal: true   # nessuna uscita verso internet: raggiungibile solo dal backend

volumes:
  searxng_cache:
  ollama_models:
  caddy_data:
  caddy_config:

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - FAMILAI_IN_DOCKER=1
      - DATA_DIR=/data
      - DATABASE_URL=sqlite+aiosqlite:////data/familai.db
      - SANDBOX_URL=http://sandbox:8080
      - WORDCRAFT_HOST=${WORDCRAFT_HOST:-}
      - WORDCRAFT_WEB=${WORDCRAFT_WEB:-0}
      - GRIDCRAFT_HOST=${GRIDCRAFT_HOST:-}
      - GRIDCRAFT_WEB=${GRIDCRAFT_WEB:-0}
      - PDFCRAFT_HOST=${PDFCRAFT_HOST:-}
      - PDFCRAFT_WEB=${PDFCRAFT_WEB:-0}
      - DECKCRAFT_HOST=${DECKCRAFT_HOST:-}
      - DECKCRAFT_WEB=${DECKCRAFT_WEB:-0}
      - IDEACRAFT_HOST=${IDEACRAFT_HOST:-}
      - IDEACRAFT_WEB=${IDEACRAFT_WEB:-0}
      - MAILCRAFT_URL=${MAILCRAFT_URL:-}
      - MAILCRAFT_MCP_HOST=${MAILCRAFT_MCP_HOST:-}
      - MAILCRAFT_TOKEN=${MAILCRAFT_TOKEN:-}
      - REMOTECRAFT_URL=${REMOTECRAFT_URL:-}
      - REMOTECRAFT_MCP_HOST=${REMOTECRAFT_MCP_HOST:-}
      - REMOTECRAFT_TOKEN=${REMOTECRAFT_TOKEN:-}
      - COVERCRAFT_URL=${COVERCRAFT_URL:-}
      - COVERCRAFT_MCP_HOST=${COVERCRAFT_MCP_HOST:-}
      - COVERCRAFT_TOKEN=${COVERCRAFT_TOKEN:-}
      - QUOTECRAFT_URL=${QUOTECRAFT_URL:-}
      - QUOTECRAFT_MCP_HOST=${QUOTECRAFT_MCP_HOST:-}
      - QUOTECRAFT_TOKEN=${QUOTECRAFT_TOKEN:-}
    volumes:
      - ./data:/data
      - ./mcp_servers.json:/app/mcp_servers.json:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default
      - sandbox_net
    depends_on:
      - sandbox
    extra_hosts:
      - "host.docker.internal:host-gateway"   # per raggiungere Ollama nativo sull'host (Mac/Linux)

  # Esecuzione codice generato dall'AI: isolata, senza internet, risorse limitate
  sandbox:
    build: ./sandbox
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /work:size=512m,uid=10001,gid=10001
    networks:
      - sandbox_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    environment:
      - SANDBOX_MAX_TIMEOUT=120
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./extras/caddy-tls:/etc/caddy/tls:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  # Ricerca web in casa: SearXNG (Google/Bing/DDG/Wikipedia via API JSON, nessuna chiave). Raggiungibile solo dal backend.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=${SECRET_KEY:-cambiami}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_cache:/var/cache/searxng
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "1" }

  # Modello locale (opzionale, per la Ubuntu/Linux): attiva con COMPOSE_PROFILES=ollama nel .env e OLLAMA_URL=http://ollama:11434.
  # Sul Mac NON usarlo: Docker non vede la GPU; installa Ollama nativo e usa OLLAMA_URL=http://host.docker.internal:11434.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    # GPU NVIDIA (se presente, con nvidia-container-toolkit): togli il commento
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # App ArtCraft (opzionali): WordCraft (word processor), GridCraft (foglio di calcolo), PdfCraft (PDF) e DeckCraft
  # (presentazioni), open source in Rust.
  # Ogni app ha due container: la CLI con il server MCP (il modello crea/modifica i file dalla chat) e l'editor completo
  # nel browser (WebAssembly, servito da Caddy su /wordcraft/, /gridcraft/, /pdfcraft/, /deckcraft/). Attivazione:
  # ./familai.sh wordcraft|gridcraft|pdfcraft|deckcraft up (imposta COMPOSE_PROFILES e le variabili *_HOST / *_WEB nel .env).
  wordcraft:
    build: { context: extras/artcraft, dockerfile: Dockerfile.cli, args: { APP: wordcraft, UPSTREAM_SHA: "${WORDCRAFT_SHA:-}" } }
    image: familai-wordcraft
    profiles: ["wordcraft"]
    restart: unless-stopped
    environment:
      - MCP_PORT=7982
      # lettura: tutta /data (allegati e file generati); scrittura: solo /data/wordcraft
      - MCP_ARGS=--author FamilAI --automation-read-root /data --automation-write-root /data/wordcraft
    volumes:
      - ./data:/data
    expose: ["7982"]
    logging: { driver: json-file, options: { max-size: "1m", max-file: "1" } }

  wordcraft-web:
    build: { context: extras/artcraft, dockerfile: Dockerfile.web, args: { APP: wordcraft, UPSTREAM_SHA: "${WORDCRAFT_SHA:-}" } }
    image: familai-wordcraft-web
    profiles: ["wordcraft"]
    restart: unless-stopped
    expose: ["80"]

  gridcraft:
    build: { context: extras/artcraft, dockerfile: Dockerfile.cli, args: { APP: gridcraft, UPSTREAM_SHA: "${GRIDCRAFT_SHA:-}" } }
    image: familai-gridcraft
    profiles: ["gridcraft"]
    restart: unless-stopped
    environment:
      - MCP_PORT=7983
      - MCP_ARGS=
    volumes:
      # GridCraft non ha il confinamento delle cartelle: legge /data in sola lettura e scrive solo in /data/gridcraft
      - ./data:/data:ro
      - ./data/gridcraft:/data/gridcraft
    expose: ["7983"]
    logging: { driver: json-file, options: { max-size: "1m", max-file: "1" } }

  gridcraft-web:
    build: { context: extras/artcraft, dockerfile: Dockerfile.web, args: { APP: gridcraft, UPSTREAM_SHA: "${GRIDCRAFT_SHA:-}" } }
    image: familai-gridcraft-web
    profiles: ["gridcraft"]
    restart: unless-stopped
    expose: ["80"]

  pdfcraft:
    build: { context: extras/artcraft, dockerfile: Dockerfile.cli, args: { APP: pdfcraft, UPSTREAM_SHA: "${PDFCRAFT_SHA:-}" } }
    image: familai-pdfcraft
    profiles: ["pdfcraft"]
    restart: unless-stopped
    environment:
      - MCP_PORT=7984
      # --root /data: ogni percorso deve stare in /data; --compact: pochi tool in elenco + tool_search/tool_call per gli altri 100+
      - MCP_ARGS=--root /data --compact
    volumes:
      - ./data:/data:ro
      - ./data/pdfcraft:/data/pdfcraft
    expose: ["7984"]
    logging: { driver: json-file, options: { max-size: "1m", max-file: "1" } }

  pdfcraft-web:
    build: { context: extras/artcraft, dockerfile: Dockerfile.web, args: { APP: pdfcraft, UPSTREAM_SHA: "${PDFCRAFT_SHA:-}" } }
    image: familai-pdfcraft-web
    profiles: ["pdfcraft"]
    restart: unless-stopped
    expose: ["80"]

  deckcraft:
    build: { context: extras/artcraft, dockerfile: Dockerfile.cli, args: { APP: deckcraft, UPSTREAM_SHA: "${DECKCRAFT_SHA:-}" } }
    image: familai-deckcraft
    profiles: ["deckcraft"]
    restart: unless-stopped
    environment:
      - MCP_PORT=7985
      - MCP_ARGS=
    volumes:
      - ./data:/data:ro
      - ./data/deckcraft:/data/deckcraft
    expose: ["7985"]
    logging: { driver: json-file, options: { max-size: "1m", max-file: "1" } }

  deckcraft-web:
    build: { context: extras/artcraft, dockerfile: Dockerfile.web, args: { APP: deckcraft, UPSTREAM_SHA: "${DECKCRAFT_SHA:-}" } }
    image: familai-deckcraft-web
    profiles: ["deckcraft"]
    restart: unless-stopped
    expose: ["80"]

  ideacraft:
    build: { context: extras/artcraft, dockerfile: Dockerfile.cli, args: { APP: ideacraft, UPSTREAM_SHA: "${IDEACRAFT_SHA:-}" } }
    image: familai-ideacraft
    profiles: ["ideacraft"]
    restart: unless-stopped
    environment:
      - MCP_PORT=7986
      - MCP_ARGS=
    volumes:
      - ./data:/data:ro
      - ./data/ideacraft:/data/ideacraft
    expose: ["7986"]
    logging: { driver: json-file, options: { max-size: "1m", max-file: "1" } }

  ideacraft-web:
    build: { context: extras/artcraft, dockerfile: Dockerfile.web, args: { APP: ideacraft, UPSTREAM_SHA: "${IDEACRAFT_SHA:-}" } }
    image: familai-ideacraft-web
    profiles: ["ideacraft"]
    restart: unless-stopped
    expose: ["80"]

  # MailCraft (extras/artcraft/Dockerfile.mailcraft): posta elettronica per utente, web app su /mailcraft/ e MCP per utente.
  # I dati (account, password cifrate 0600, cache) stanno in ./private/mailcraft, FUORI da ./data: le altre app montano
  # ./data in lettura e non devono poter leggere le caselle degli altri utenti.
  mailcraft:
    build: { context: extras/artcraft, dockerfile: Dockerfile.mailcraft, args: { UPSTREAM_SHA: "${MAILCRAFT_SHA:-}" } }
    image: familai-mailcraft
    profiles: ["mailcraft"]
    restart: unless-stopped
    environment:
      - MAILCRAFT_TOKEN=${MAILCRAFT_TOKEN:-}
      - MAILCRAFT_LANG=it
      - MCP_PORT=7889
      # OAuth Gmail / Microsoft 365 (facoltativo): client creati nelle console dei provider, vedi README
      - MAILCRAFT_GOOGLE_CLIENT_ID=${MAILCRAFT_GOOGLE_CLIENT_ID:-}
      - MAILCRAFT_GOOGLE_CLIENT_SECRET=${MAILCRAFT_GOOGLE_CLIENT_SECRET:-}
      - MAILCRAFT_MICROSOFT_CLIENT_ID=${MAILCRAFT_MICROSOFT_CLIENT_ID:-}
      - MAILCRAFT_MICROSOFT_CLIENT_SECRET=${MAILCRAFT_MICROSOFT_CLIENT_SECRET:-}
      - MAILCRAFT_PUBLIC_URL=${MAILCRAFT_PUBLIC_URL:-}
    volumes:
      - ./private/mailcraft:/mail            # account, password, cache per utente (fuori da ./data)
      - ./data:/data:ro                      # i file di FamilAI: allegati da inviare (/data/<app>/…)
      - ./data/mailcraft:/data/mailcraft     # allegati ricevuti salvati con save_attachment: compaiono in chat
    expose: ["7878", "7889"]
    logging: { driver: json-file, options: { max-size: "1m", max-file: "1" } }

  # RemoteCraft (https://github.com/rickyb82/remotecraft): server RustDesk (hbbs/hbbr, porte pubbliche 21115-21117) e
  # gestionale dell'assistenza (clienti, PC, interventi, GDPR) nello stesso container (extras/artcraft/Dockerfile.remotecraft,
  # equivalente a quello del repository ma multi-architettura e con la cache di cargo). Dati in ./private/remotecraft (chiavi RustDesk: perderle = riconfigurare tutti i client; fare backup).
  remotecraft:
    build:
      context: extras/artcraft
      dockerfile: Dockerfile.remotecraft
      args: { REF: "${REMOTECRAFT_REF:-main}", RUSTDESK_TAG: "${RUSTDESK_TAG:-1.1.16}" }
    image: familai-remotecraft
    profiles: ["remotecraft"]
    restart: unless-stopped
    environment:
      - REMOTECRAFT_TOKEN=${REMOTECRAFT_TOKEN:-}
      - RUSTDESK_HOST=${RUSTDESK_HOST:-}
      - TZ=${TZ:-Europe/Rome}
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21117:21117"
    expose: ["7979"]
    volumes:
      - ./private/remotecraft/rustdesk:/data/rustdesk
      - ./private/remotecraft/desk:/data/desk
    logging: { driver: json-file, options: { max-size: "1m", max-file: "1" } }

  remotecraft-mcp:
    build: { context: extras/artcraft, dockerfile: Dockerfile.remotecraft-mcp, args: { REF: "${REMOTECRAFT_REF:-main}" } }
    image: familai-remotecraft-mcp
    profiles: ["remotecraft"]
    restart: unless-stopped
    depends_on: [remotecraft]
    environment:
      - MCP_PORT=7989
      - REMOTECRAFT_SERVER=http://remotecraft:7979
    expose: ["7989"]
    logging: { driver: json-file, options: { max-size: "1m", max-file: "1" } }

  # CoverCraft (https://github.com/rickyb82/covercraft): verifica di copertura della connettivita' a un indirizzo dal database
  # dell'operatore (TIM/FiberCop, Open Fiber, Fastweb, rete propria, ponti radio, celle). Un container: web app + API su 7979 e ponte MCP per
  # utente su 7999 (extras/artcraft/Dockerfile.covercraft). Il token di servizio non lascia la rete Docker: il backend fa da proxy autenticato
  # (/covercraft/api/* -> backend -> covercraft) e indica l'utente con X-Covercraft-User. Configurazione (database MySQL, password) in ./private/covercraft.
  covercraft:
    build: { context: extras/artcraft, dockerfile: Dockerfile.covercraft, args: { REF: "${COVERCRAFT_REF:-main}" } }
    image: familai-covercraft
    profiles: ["covercraft"]
    restart: unless-stopped
    environment:
      - COVERCRAFT_TOKEN=${COVERCRAFT_TOKEN:-}
      - COVERCRAFT_LANG=it
      - MCP_PORT=7999
      - TZ=${TZ:-Europe/Rome}
    expose: ["7979", "7999"]
    volumes:
      - ./private/covercraft:/data              # config.json + secrets.json (password del database, leggibile solo dal container)
    logging: { driver: json-file, options: { max-size: "1m", max-file: "1" } }

  # QuoteCraft (https://github.com/rickyb82/quotecraft): preventivatore con listino per il commerciale, documenti con wordcraft-cli
  # (nello stesso container) su carta intestata, invio via MailCraft a nome dell'utente. Web app + API su 7878 e ponte MCP per utente
  # su 7899 (extras/artcraft/Dockerfile.quotecraft). Il token di servizio resta nella rete Docker: il backend fa da proxy autenticato
  # (/quotecraft/api/* -> backend -> quotecraft) e aggiunge utente, ruolo (admin per gli amministratori dell'app) e identita' MailCraft.
  # Dati (listino, clienti, preventivi, config, carta intestata) in ./private/quotecraft; i documenti prodotti in ./data/quotecraft
  # (cosi' compaiono in chat e in Documenti); ./data in sola lettura per importare una carta intestata dai file di Emily.
  quotecraft:
    build: { context: extras/artcraft, dockerfile: Dockerfile.quotecraft, args: { REF: "${QUOTECRAFT_REF:-main}", WORDCRAFT_REF: "${WORDCRAFT_REF:-main}" } }
    image: familai-quotecraft
    profiles: ["quotecraft"]
    restart: unless-stopped
    environment:
      - QUOTECRAFT_TOKEN=${QUOTECRAFT_TOKEN:-}
      - QUOTECRAFT_LANG=it
      - MCP_PORT=7899
      - TZ=${TZ:-Europe/Rome}
    expose: ["7878", "7899"]
    volumes:
      - ./private/quotecraft:/qc
      - ./data/quotecraft:/qc/out
      - ./data:/data:ro
    logging: { driver: json-file, options: { max-size: "1m", max-file: "1" } }

  # Geocoder Nominatim per CoverCraft (facoltativo, ./familai.sh covercraft geo up): interrogato solo quando le tabelle non danno
  # un punto per il civico. Il primo avvio importa l'Italia (~2 GB di download, 1-3 ore, ~10 GB di RAM); poi parte in fretta.
  # Dati in volumi Docker (Postgres sui bind mount di macOS e' lentissimo). Nessuna porta sull'host: lo raggiunge solo covercraft.
  nominatim:
    image: mediagis/nominatim:5.1
    profiles: ["nominatim"]
    restart: unless-stopped
    environment:
      - PBF_URL=${NOMINATIM_PBF_URL:-https://download.geofabrik.de/europe/italy-latest.osm.pbf}
      - REPLICATION_URL=${NOMINATIM_REPLICATION_URL:-https://download.geofabrik.de/europe/italy-updates/}
      - NOMINATIM_PASSWORD=${NOMINATIM_PASSWORD:-change-me}
      - IMPORT_WIKIPEDIA=false
      - THREADS=${NOMINATIM_THREADS:-4}
    volumes:
      - nominatim-data:/var/lib/postgresql/16/main
      - nominatim-flatnode:/nominatim/flatnode
    expose: ["8080"]
    shm_size: 1g
    logging: { driver: json-file, options: { max-size: "2m", max-file: "2" } }

networks:
  default:
  sandbox_net:
    internal: true   # nessuna uscita verso internet: raggiungibile solo dal backend

volumes:
  nominatim-data:
  nominatim-flatnode:
  searxng_cache:
  ollama_models:
  caddy_data:
  caddy_config:
